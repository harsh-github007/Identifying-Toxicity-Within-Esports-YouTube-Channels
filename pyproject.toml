[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esports-toxicity"
version = "2.0.0"
description = "Measuring toxicity in the comment sections of Indian esports YouTube channels"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
model = ["detoxify>=0.5.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
